plugins {
    id("com.github.johnrengelman.shadow") version "7.1.2"
    id("io.micronaut.application") version "3.7.10"
}

version = "0.1"
group = "com.example"

repositories {
    mavenCentral()
}

dependencies {
    // Micronaut Core
    implementation("io.micronaut:micronaut-runtime:3.4.4")
    implementation("io.micronaut:micronaut-http-client:3.4.4")
    implementation("io.micronaut:micronaut-jackson-databind:3.4.4")
    implementation("io.micronaut:micronaut-validation:3.4.4")
    annotationProcessor("io.micronaut:micronaut-inject-java:3.4.4")

    // AWS Lambda Function Support
    implementation("io.micronaut.aws:micronaut-function-aws-api-proxy:3.4.0")
    implementation("io.micronaut.aws:micronaut-aws-sdk-v2:3.4.0")

    // AWS SDKs (S3 & DynamoDB)
    implementation("software.amazon.awssdk:s3:2.20.120")
    implementation("software.amazon.awssdk:dynamodb:2.20.120")
    implementation("com.amazonaws:aws-lambda-java-events:3.11.0")
    implementation("software.amazon.awssdk:dynamodb:2.17.89")



    // Annotations + Logging
    implementation("jakarta.annotation:jakarta.annotation-api:1.3.5")
    runtimeOnly("ch.qos.logback:logback-classic:1.2.11")
}



application {
    mainClass.set("com.example.Application")
}
java {
    sourceCompatibility = JavaVersion.toVersion("11")
    targetCompatibility = JavaVersion.toVersion("11")
}

graalvmNative.toolchainDetection = false
micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("com.example.*")
    }
}



